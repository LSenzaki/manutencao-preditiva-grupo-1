spring:
  application:
    name: manutencao-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/manutencao}
    username: ${SPRING_DATASOURCE_USERNAME:mp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:troque_esta_senha}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

ml:
  python-command: ${ML_PYTHON_COMMAND:python}
  predict-script: ${ML_PREDICT_SCRIPT:ml/predict.py}
  timeout-ms: ${ML_TIMEOUT_MS:10000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
