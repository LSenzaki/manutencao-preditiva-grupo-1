services:
  postgres:
    image: postgres:16-alpine
    container_name: mp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manutencao}
      POSTGRES_USER: ${POSTGRES_USER:-mp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"   # 5433 no host p/ não colidir com Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mp_user} -d ${POSTGRES_DB:-manutencao}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: manutencao-preditiva-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mp-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-manutencao}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mp_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-troque_esta_senha}
      ML_PYTHON_COMMAND: /opt/ml-venv/bin/python
      ML_PREDICT_SCRIPT: /app/ml/predict.py
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  pgdata:
